[build]
  # run everything from the repo root to avoid base-dir mismatches on Netlify
  command = "CI='' bash -lc 'cd prototype-2 && npm ci && npm run build'"
  publish = "prototype-2/.next"

[build.environment]
  NODE_VERSION = "22.20.0"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PRIVATE_TARGET = "server"


